<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排班小管家 & 艾維園藝</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="艾維排班">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/000000/calendar--v1.png">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuiJvue2remUremXneS9kXm3uSIsCiAgInNob3J0X25hbWUiOiAi6Imm6Ze7IiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmOGY5ZmEiLAogICJ0aGVtZV9jb2xvciI6ICIjNGE3YzU5IgppfQ==">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #f2f4f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .phone-frame {
            width: 100%;
            max-width: 414px;
            height: 844px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 8px solid #222;
        }
        /* Top Island / Notch */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
            background: #222;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 1000;
        }
        /* App Header / Switcher Bar */
        .app-header {
            background: #2d3748;
            color: #fff;
            padding: 40px 16px 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }
        .role-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-emp { background: #319795; color: white; }
        .role-mgr { background: #dd6b20; color: white; }
        
        /* App Content Area */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background-color: #f7fafc;
        }

        /* Bottom Nav */
        .bottom-nav {
            height: 65px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 10px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #718096;
            cursor: pointer;
            text-decoration: none;
            flex: 1;
        }
        .nav-item.active {
            color: #2b6cb0;
            font-weight: bold;
        }
        .nav-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 3px;
            fill: currentColor;
        }

        /* Card styles */
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #edf2f7;
        }
        .card-title {
            font-size: 13px;
            color: #718096;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .time-display {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            text-align: center;
        }
        .date-display {
            font-size: 13px;
            color: #718096;
            text-align: center;
            margin-bottom: 8px;
        }
        .shift-badge {
            background: #c6f6d5;
            color: #22543d;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .info-row {
            display: flex;
            align-items: center;
            margin-top: 8px;
            font-size: 13px;
            color: #4a5568;
        }
        .info-row icon {
            margin-right: 8px;
        }
        
        /* Grid Buttons */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        .btn-card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #edf2f7;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-card:active { transform: scale(0.98); }
        .btn-card h4 { font-size: 14px; color: #2d3748; margin-top: 6px; }
        .btn-card p { font-size: 11px; color: #a0aec0; }

        /* Calendar Mock */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
            margin-top: 10px;
        }
        .cal-head { font-size: 12px; color: #a0aec0; font-weight: 600; padding-bottom: 4px; }
        .cal-day {
            aspect-ratio: 1;
            background: #f7fafc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .cal-day.active { background: #ebf8ff; border-color: #3182ce; color: #2b6cb0; font-weight: bold; }
        .cal-day.selected { background: #3182ce; color: white; }
        .cal-day .tag { font-size: 9px; margin-top: 2px; }

        /* Status Badge */
        .badge {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-pending { background: #feebc8; color: #742a2a; }
        .badge-approved { background: #c6f6d5; color: #22543d; }
        .badge-rejected { background: #fed7d7; color: #9b2c2c; }

        /* Form Controls */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #4a5568; margin-bottom: 4px; font-weight: 600; }
        .form-control {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e0;
            font-size: 13px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-success { background: #38a169; }
        .btn-danger { background: #e53e3e; }
        .btn-sm { padding: 6px 12px; font-size: 12px; width: auto; }

        /* Modal */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
        }

        /* PWA Banner */
        .pwa-prompt {
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #2c5282;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="notch"></div>
    
    <!-- App Header / Role Switcher -->
    <div class="app-header">
        <span id="app-title">員工小管家</span>
        <div class="role-badge role-emp" id="role-btn" onclick="toggleRole()">切換至主管端</div>
    </div>

    <!-- App Body -->
    <div class="app-body" id="app-body">
        <!-- Content will be injected by JavaScript -->
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav" id="bottom-nav">
        <!-- Nav items dynamically changed by role -->
    </div>
</div>

<!-- Modal for Leave Request -->
<div class="modal" id="leave-modal">
    <div class="modal-content">
        <h3 style="margin-bottom:12px; font-size:16px;">申請假單</h3>
        <div class="form-group">
            <label>假別</label>
            <select class="form-control" id="leave-type">
                <option>特別休假</option>
                <option>事假</option>
                <option>病假</option>
            </select>
        </div>
        <div class="form-group">
            <label>日期</label>
            <input type="date" class="form-control" id="leave-date" value="2026-08-28">
        </div>
        <div class="form-group">
            <label>事由</label>
            <input type="text" class="form-control" id="leave-reason" placeholder="請輸入請假事由">
        </div>
        <div style="display:flex; gap:8px; margin-top:16px;">
            <button class="btn" style="background:#a0aec0;" onclick="closeModal()">取消</button>
            <button class="btn" onclick="submitLeave()">提交申請</button>
        </div>
    </div>
</div>

<!-- Modal for Adding Schedule (Manager) -->
<div class="modal" id="schedule-modal">
    <div class="modal-content">
        <h3 style="margin-bottom:12px; font-size:16px;">新增 / 編輯排班</h3>
        <div class="form-group">
            <label>員工</label>
            <select class="form-control" id="sched-emp">
                <option>珮甄 (理財專員)</option>
                <option>王小明 (業務專員)</option>
                <option>林小美 (行政助理)</option>
            </select>
        </div>
        <div class="form-group">
            <label>日期</label>
            <input type="date" class="form-control" id="sched-date" value="2026-08-19">
        </div>
        <div class="form-group">
            <label>班別時間</label>
            <input type="text" class="form-control" id="sched-time" value="09:00 - 18:00 (早班)">
        </div>
        <div class="form-group">
            <label>📍 工作地點</label>
            <input type="text" class="form-control" id="sched-loc" value="台中總行">
        </div>
        <div class="form-group">
            <label>🔧 工具備註</label>
            <input type="text" class="form-control" id="sched-tools" value="公務筆電、員工證">
        </div>
        <div class="form-group">
            <label>📄 工作任務</label>
            <input type="text" class="form-control" id="sched-task" value="例行業務核對">
        </div>
        <div style="display:flex; gap:8px; margin-top:16px;">
            <button class="btn" style="background:#a0aec0;" onclick="closeSchedModal()">取消</button>
            <button class="btn btn-success" onclick="saveSchedule()">保存並發送通知</button>
        </div>
    </div>
</div>

<script>
    // System State Shared between Employee & Manager
    let currentRole = 'employee'; // 'employee' or 'manager'
    let currentTab = 'home'; // employee: home, cal, leave, profile | manager: today, approve, sched, month

    // Shared Database Simulation
    let db = {
        schedules: [
            { id: 1, emp: '珮甄', date: '2026-08-18', time: '09:00 - 18:00', shift: '早班', loc: '台中總行', tools: '公務筆電、員工證', task: '總行理財部門季度培訓' },
            { id: 2, emp: '王小明', date: '2026-08-18', time: '09:00 - 18:00', shift: '早班', loc: '台中總行', tools: '業務報表', task: '客戶拜訪' },
            { id: 3, emp: '林小美', date: '2026-08-18', time: '09:00 - 18:00', shift: '早班', loc: '水湳分行', tools: '行政文件', task: '一般行政作業' },
            { id: 4, emp: '珮甄', date: '2026-08-19', time: '13:00 - 22:00', shift: '晚班', loc: '水湳分行', tools: '理財規劃書', task: '下午 14:00 VIP 會議' }
        ],
        leaves: [
            { id: 1, emp: '珮甄', title: '特別休假', date: '2026-08-28', status: '待審核', reason: '個人家庭事務處理' },
            { id: 2, emp: '王小明', title: '事假', date: '2026-08-20', status: '待審核', reason: '看診回診' }
        ],
        empAvailableDates: ['2026-08-21', '2026-08-22', '2026-08-25']
    };

    function toggleRole() {
        if (currentRole === 'employee') {
            currentRole = 'manager';
            currentTab = 'today';
        } else {
            currentRole = 'employee';
            currentTab = 'home';
        }
        renderApp();
    }

    function switchTab(tab) {
        currentTab = tab;
        renderApp();
    }

    function renderApp() {
        const titleEl = document.getElementById('app-title');
        const roleBtn = document.getElementById('role-btn');
        const bodyEl = document.getElementById('app-body');
        const navEl = document.getElementById('bottom-nav');

        if (currentRole === 'employee') {
            titleEl.innerText = '員工小管家';
            roleBtn.innerText = '切換至主管端';
            roleBtn.className = 'role-badge role-emp';

            // Employee Nav
            navEl.innerHTML = `
                <div class="nav-item ${currentTab==='home'?'active':''}" onclick="switchTab('home')">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    首頁
                </div>
                <div class="nav-item ${currentTab==='cal'?'active':''}" onclick="switchTab('cal')">
                    <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                    班表
                </div>
                <div class="nav-item ${currentTab==='leave'?'active':''}" onclick="switchTab('leave')">
                    <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                    請假
                </div>
                <div class="nav-item ${currentTab==='profile'?'active':''}" onclick="switchTab('profile')">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    我的
                </div>
            `;

            // Employee Views
            if (currentTab === 'home') renderEmpHome(bodyEl);
            else if (currentTab === 'cal') renderEmpCalendar(bodyEl);
            else if (currentTab === 'leave') renderEmpLeave(bodyEl);
            else if (currentTab === 'profile') renderEmpProfile(bodyEl);

        } else {
            titleEl.innerText = '艾維園藝 (主管端)';
            roleBtn.innerText = '切換至員工端';
            roleBtn.className = 'role-badge role-mgr';

            // Manager Nav
            navEl.innerHTML = `
                <div class="nav-item ${currentTab==='today'?'active':''}" onclick="switchTab('today')">
                    <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                    今日班表
                </div>
                <div class="nav-item ${currentTab==='approve'?'active':''}" onclick="switchTab('approve')">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    請假審核
                </div>
                <div class="nav-item ${currentTab==='sched'?'active':''}" onclick="switchTab('sched')">
                    <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg>
                    排班管理
                </div>
                <div class="nav-item ${currentTab==='month'?'active':''}" onclick="switchTab('month')">
                    <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zM16.2 13H19v6h-2.8z"/></svg>
                    本月統計
                </div>
            `;

            // Manager Views
            if (currentTab === 'today') renderMgrToday(bodyEl);
            else if (currentTab === 'approve') renderMgrApprove(bodyEl);
            else if (currentTab === 'sched') renderMgrSched(bodyEl);
            else if (currentTab === 'month') renderMgrMonth(bodyEl);
        }
    }

    /* --- EMPLOYEE VIEWS --- */
    function renderEmpHome(el) {
        let todaySched = db.schedules.find(s => s.emp === '珮甄' && s.date === '2026-08-18');
        el.innerHTML = `
            <div class="pwa-prompt">
                <span>📱 安裝至手機桌面以方便使用</span>
                <button class="btn btn-sm" onclick="alert('請點選瀏覽器的「分享」選單，然後選擇「加入主畫面」即可！')">安裝說明</button>
            </div>
            <div style="font-size:18px; font-weight:bold; margin-bottom:12px;">嗨，珮甄 👋</div>
            
            <div class="card" style="text-align:center;">
                <div class="card-title">現在時間</div>
                <div class="time-display">20:09</div>
                <div class="date-display">2026 / 8 / 18 星期二</div>
            </div>

            <div class="card">
                <div style="display:flex; justify-size:space-between; align-items:center;">
                    <span class="card-title" style="margin:0;">今日班次</span>
                    <span class="shift-badge">${todaySched ? todaySched.shift : '休假'}</span>
                </div>
                <div style="font-size:20px; font-weight:bold; margin:8px 0; color:#2d3748;">
                    ${todaySched ? todaySched.time : '今日無排班'}
                </div>
                ${todaySched ? `
                    <div class="info-row">📍 ${todaySched.loc}</div>
                    <div class="info-row">🔧 ${todaySched.tools}</div>
                    <div class="info-row">📄 ${todaySched.task}</div>
                ` : ''}
            </div>

            <div class="grid-2">
                <div class="btn-card" onclick="switchTab('leave')">
                    <span style="font-size:20px;">📝</span>
                    <h4>我要請假</h4>
                    <p>快速提交假單</p>
                </div>
                <div class="btn-card" onclick="switchTab('cal')">
                    <span style="font-size:20px;">📅</span>
                    <h4>我的班表</h4>
                    <p>查看本月排班</p>
                </div>
            </div>

            <div class="card">
                <div class="card-title">🔔 最新公告</div>
                <p style="font-size:12px; color:#4a5568;">8 月排班已更新，請確認自己的班表。若需要調班或請假，請於系統提出申請。</p>
            </div>
        `;
    }

    function renderEmpCalendar(el) {
        let empScheds = db.schedules.filter(s => s.emp === '珮甄');
        let approvedLeaves = db.leaves.filter(l => l.emp === '珮甄' && l.status === '已核准');

        el.innerHTML = `
            <div style="font-size:18px; font-weight:bold; margin-bottom:12px;">班表 (2026年 8月)</div>
            <div class="card">
                <p style="font-size:11px; color:#718096; margin-bottom:8px;">💡 點擊日期可預先勾選「可上班天數」提交給主管：</p>
                <div class="calendar-grid">
                    <div class="cal-head">日</div><div class="cal-head">一</div><div class="cal-head">二</div><div class="cal-head">三</div><div class="cal-head">四</div><div class="cal-head">五</div><div class="cal-head">六</div>
                    <!-- Mock Days -->
                    <div class="cal-day"></div><div class="cal-day"></div><div class="cal-day"></div><div class="cal-day"></div><div class="cal-day"></div><div class="cal-day"></div><div class="cal-day">1</div>
                    <div class="cal-day">2</div><div class="cal-day">3</div><div class="cal-day">4</div><div class="cal-day">5</div><div class="cal-day">6</div><div class="cal-day">7</div><div class="cal-day">8</div>
                    <div class="cal-day">9</div><div class="cal-day">10</div><div class="cal-day">11</div><div class="cal-day">12</div><div class="cal-day">13</div><div class="cal-day">14</div><div class="cal-day">15</div>
                    <div class="cal-day">16</div>
                    <div class="cal-day active">17<span class="tag">09:00</span></div>
                    <div class="cal-day active">18<span class="tag">09:00</span></div>
                    <div class="cal-day active">19<span class="tag">13:00</span></div>
                    <div class="cal-day active">20<span class="tag">09:00</span></div>
                    <div class="cal-day ${db.empAvailableDates.includes('2026-08-21')?'selected':''}" onclick="toggleAvail('2026-08-21')">21<span class="tag">${db.empAvailableDates.includes('2026-08-21')?'可上班':''}</span></div>
                    <div class="cal-day ${db.empAvailableDates.includes('2026-08-22')?'selected':''}" onclick="toggleAvail('2026-08-22')">22<span class="tag">${db.empAvailableDates.includes('2026-08-22')?'可上班':''}</span></div>
                </div>
            </div>

            <div class="grid-2">
                <div class="card" style="text-align:center;">
                    <div class="card-title">已排班</div>
                    <div style="font-size:24px; font-weight:bold; color:#2b6cb0;">${empScheds.length + 6} 天</div>
                </div>
                <div class="card" style="text-align:center;">
                    <div class="card-title">休假 / 請假天數</div>
                    <div style="font-size:24px; font-weight:bold; color:#e53e3e;">${approvedLeaves.length} 天</div>
                </div>
            </div>
        `;
    }

    function toggleAvail(date) {
        let idx = db.empAvailableDates.indexOf(date);
        if (idx > -1) db.empAvailableDates.splice(idx, 1);
        else db.empAvailableDates.push(date);
        renderApp();
    }

    function renderEmpLeave(el) {
        let empLeaves = db.leaves.filter(l => l.emp === '珮甄');
        el.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-size:18px; font-weight:bold;">請假紀錄</span>
                <button class="btn btn-sm" onclick="openModal()">+ 申請假單</button>
            </div>
            ${empLeaves.map(l => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <span style="font-weight:bold; font-size:14px;">${l.title}</span>
                        <span class="badge ${l.status==='待審核'?'badge-pending':l.status==='已核准'?'badge-approved':'badge-rejected'}">${l.status}</span>
                    </div>
                    <div style="font-size:12px; color:#718096;">${l.date} (1天)</div>
                    <div style="font-size:12px; color:#4a5568; margin-top:4px;">事由：${l.reason}</div>
                </div>
            `).join('')}
        `;
    }

    function renderEmpProfile(el) {
        el.innerHTML = `
            <div class="card" style="text-align:center; padding:24px;">
                <div style="width:70px; height:70px; border-radius:50%; background:#cbd5e0; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:28px;">珮</div>
                <h3 style="font-size:16px;">珮甄</h3>
                <p style="font-size:12px; color:#718096; margin-top:2px;">理財專員 | 員工編號 #8021</p>
                <button class="btn btn-sm" style="margin-top:12px; background:#edf2f7; color:#4a5568;" onclick="alert('相機存取成功！可選擇頭像照片')">📷 更改頭像</button>
            </div>
            <div class="card">
                <div class="card-title">基本資訊</div>
                <div class="info-row">🏢 所屬部門：總行理財部</div>
                <div class="info-row">📧 電子郵件：peizhen@ivy.com</div>
                <div class="info-row">📞 聯絡電話：0912-345-678</div>
            </div>
        `;
    }

    /* --- MANAGER VIEWS --- */
    function renderMgrToday(el) {
        let todayScheds = db.schedules.filter(s => s.date === '2026-08-18');
        el.innerHTML = `
            <div style="font-size:18px; font-weight:bold; margin-bottom:12px;">今日班表 (2026-08-18)</div>
            <div class="grid-2">
                <div class="card" style="text-align:center;">
                    <div class="card-title">今日出班</div>
                    <div style="font-size:24px; font-weight:bold; color:#2b6cb0;">${todayScheds.length} 人</div>
                </div>
                <div class="card" style="text-align:center;">
                    <div class="card-title">晚班人數</div>
                    <div style="font-size:24px; font-weight:bold; color:#dd6b20;">0 人</div>
                </div>
            </div>

            <div style="font-size:13px; font-weight:600; color:#718096; margin-bottom:8px;">早班人員</div>
            ${todayScheds.map(s => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; font-size:14px;">${s.emp}</span>
                        <span style="font-size:12px; color:#4a5568;">${s.time}</span>
                    </div>
                    <div class="info-row">📍 ${s.loc}</div>
                    <div class="info-row">🔧 ${s.tools}</div>
                    <div class="info-row">📄 ${s.task}</div>
                </div>
            `).join('')}
        `;
    }

    function renderMgrApprove(el) {
        let pending = db.leaves.filter(l => l.status === '待審核');
        let processed = db.leaves.filter(l => l.status !== '待審核');

        el.innerHTML = `
            <div style="font-size:18px; font-weight:bold; margin-bottom:12px;">請假審核</div>
            <div style="font-size:13px; font-weight:600; color:#718096; margin-bottom:8px;">待審核 (${pending.length})</div>
            ${pending.length === 0 ? '<p style="font-size:12px; color:#a0aec0;">目前無待審核假單</p>' : ''}
            ${pending.map(l => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; font-size:14px;">${l.emp} - ${l.title}</span>
                        <span class="badge badge-pending">待審核</span>
                    </div>
                    <div style="font-size:12px; color:#718096; margin-top:4px;">${l.date} (1天)</div>
                    <div style="font-size:12px; color:#4a5568; margin-top:4px;">事由：${l.reason}</div>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <button class="btn btn-sm btn-success" onclick="approveLeave(${l.id}, '已核准')">核准</button>
                        <button class="btn btn-sm btn-danger" onclick="approveLeave(${l.id}, '已拒絕')">拒絕</button>
                    </div>
                </div>
            `).join('')}

            ${processed.length > 0 ? `
                <div style="font-size:13px; font-weight:600; color:#718096; margin:16px 0 8px 0;">已處理紀錄</div>
                ${processed.map(l => `
                    <div class="card" style="opacity:0.7;">
                        <div style="display:flex; justify-content:space-between;">
                            <span>${l.emp} (${l.title})</span>
                            <span class="badge ${l.status==='已核准'?'badge-approved':'badge-rejected'}">${l.status}</span>
                        </div>
                    </div>
                `).join('')}
            ` : ''}
        `;
    }

    function approveLeave(id, status) {
        let leave = db.leaves.find(l => l.id === id);
        if (leave) {
            leave.status = status;
            alert(`已將 ${leave.emp} 的假單標記為 [${status}]！將同步通知員工。`);
            renderApp();
        }
    }

    function renderMgrSched(el) {
        el.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-size:18px; font-weight:bold;">排班管理</span>
                <button class="btn btn-sm" onclick="openSchedModal()">+ 新增排班</button>
            </div>
            
            <div class="card" style="background:#fffaf0; border-color:#feebc8;">
                <div class="card-title" style="color:#c05621;">💡 員工提交的可上班意願</div>
                <div style="font-size:12px; color:#742a2a;">珮甄 勾選了：8/21, 8/22, 8/25 可上班</div>
            </div>

            ${db.schedules.map(s => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold;">${s.emp} (${s.date})</span>
                        <span style="font-size:11px; color:#a0aec0;" onclick="deleteSched(${s.id})">🗑️ 刪除</span>
                    </div>
                    <div style="font-size:12px; color:#3182ce; font-weight:bold; margin-top:4px;">${s.time} [${s.shift}]</div>
                    <div class="info-row">📍 ${s.loc}</div>
                    <div class="info-row">🔧 ${s.tools}</div>
                    <div class="info-row">📄 ${s.task}</div>
                </div>
            `).join('')}
        `;
    }

    function deleteSched(id) {
        db.schedules = db.schedules.filter(s => s.id !== id);
        renderApp();
    }

    function renderMgrMonth(el) {
        el.innerHTML = `
            <div style="font-size:18px; font-weight:bold; margin-bottom:12px;">本月排班統計 (2026/08)</div>
            <div class="card">
                <table style="width:100%; font-size:13px; text-align:left; border-collapse:collapse;">
                    <thead>
                        <tr style="border-bottom:1px solid #edf2f7; color:#718096;">
                            <th style="padding:8px 0;">員工</th>
                            <th>已排班</th>
                            <th>請假天數</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="border-bottom:1px solid #edf2f7;">
                            <td style="padding:10px 0; font-weight:bold;">珮甄</td>
                            <td>8 天</td>
                            <td>1 天</td>
                        </tr>
                        <tr style="border-bottom:1px solid #edf2f7;">
                            <td style="padding:10px 0; font-weight:bold;">王小明</td>
                            <td>10 天</td>
                            <td>1 天</td>
                        </tr>
                        <tr>
                            <td style="padding:10px 0; font-weight:bold;">林小美</td>
                            <td>12 天</td>
                            <td>0 天</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        `;
    }

    /* Modal Controls */
    function openModal() { document.getElementById('leave-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('leave-modal').style.display = 'none'; }
    function submitLeave() {
        let type = document.getElementById('leave-type').value;
        let date = document.getElementById('leave-date').value;
        let reason = document.getElementById('leave-reason').value || '無說明';
        db.leaves.push({
            id: Date.now(),
            emp: '珮甄',
            title: type,
            date: date,
            status: '待審核',
            reason: reason
        });
        closeModal();
        alert('假單已送出，等待主管審核！');
        renderApp();
    }

    function openSchedModal() { document.getElementById('schedule-modal').style.display = 'flex'; }
    function closeSchedModal() { document.getElementById('schedule-modal').style.display = 'none'; }
    function saveSchedule() {
        let emp = document.getElementById('sched-emp').value.split(' ')[0];
        let date = document.getElementById('sched-date').value;
        let time = document.getElementById('sched-time').value;
        let loc = document.getElementById('sched-loc').value;
        let tools = document.getElementById('sched-tools').value;
        let task = document.getElementById('sched-task').value;

        db.schedules.push({
            id: Date.now(),
            emp: emp,
            date: date,
            time: time,
            shift: '早班',
            loc: loc,
            tools: tools,
            task: task
        });
        closeSchedModal();
        alert(`已成功更新 ${emp} 的排班，並發送 App 推播通知！`);
        renderApp();
    }

    // Initialize
    renderApp();
</script>
</body>
</html>
